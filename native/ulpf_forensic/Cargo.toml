[package]
name = "ulpf_forensic"
version = "10.0.0"
edition = "2021"
description = "ulpf-forensic-verify: standalone, air-gapped verifier for ULPF journals, seals and Merkle proofs"
license = "MIT"
publish = false

[[bin]]
name = "ulpf-forensic-verify"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
crc32fast = "1"
aes-gcm = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

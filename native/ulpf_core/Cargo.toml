[package]
name = "ulpf_core"
version = "0.2.0"
edition = "2021"
description = "Compiled hot path for ULPF: raw records to Arrow event-store columns (the Python pipeline is the reference)"
license = "MIT"
publish = false

[lib]
name = "ulpf_core"
crate-type = ["cdylib", "rlib"]

[features]
# per-stage counters of Build::build for `cargo test --features stage-timing ... bench::stages`
stage-timing = []

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
blake2b_simd = "1"
# the system allocator on Windows made allocation-heavy event building 2-3x slower
mimalloc = { version = "0.1", default-features = false }
rustc-hash = "2"
itoa = "1"
memchr = "2"
aho-corasick = "1"
arc-swap = "1"
memmap2 = "0.9"
compact_str = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "gzip", "codegen", "tls"] }
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
aes = "0.8"
cfb-mode = "0.8"
bytes = "1"
http-body-util = "0.1"
rustls-pemfile = "2"
socket2 = { version = "0.5", features = ["all"] }
unicode-general-category = "1"
http = "1"
tower-service = "0.3"
http-body = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
aes-gcm = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

# Fluent Bit: TCP in (raw lines), syslog parser, JSON lines file out.
# Run by benchmarks/competitive/run.py with PORT, OUT_DIR and OUT_FILE set in the environment.
[SERVICE]
    Flush        1
    Parsers_File parsers.conf

[INPUT]
    Name   tcp
    Listen 127.0.0.1
    Port   ${PORT}
    Format none

[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       syslog-rfc3164
    Reserve_Data On

[OUTPUT]
    Name   file
    Match  *
    Path   ${OUT_DIR}
    File   ${OUT_FILE}
    Format plain

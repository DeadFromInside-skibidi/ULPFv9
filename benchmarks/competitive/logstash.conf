# Logstash: TCP in, syslog grok when it matches, JSON lines file out.
# Run by benchmarks/competitive/run.py with PORT and OUT set in the environment.
input {
  tcp { host => "127.0.0.1" port => "${PORT}" codec => line }
}
filter {
  grok {
    match => { "message" => "%{SYSLOGLINE}" }
    tag_on_failure => []
  }
}
output {
  file { path => "${OUT}" codec => json_lines }
}

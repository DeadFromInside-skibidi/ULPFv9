[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf"
version = "10.0.0"
description = "Universal Log Pre-processing Framework — security log parsing, normalisation and analytics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ULPF Team" }
]
dependencies = [
    "duckdb>=1.1.0",          # allowed_directories (defence-mode external-access lockdown)
    "pyarrow>=14.0.0",
    "orjson>=3.9.0",
    "python-dateutil>=2.8.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0",
    "cryptography>=41.0",     # AES-GCM journal, Ed25519 seals/parser signatures, X25519 key escrow
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
]
tui = [
    "rich>=13.0.0",
    "textual>=0.40.0",
]
gui = [
    "PySide6>=6.5.0",
]
kafka = ["confluent-kafka>=2.3.0"]
mqtt = ["paho-mqtt>=1.6.0"]
eventhubs = ["azure-eventhub>=5.11.0"]
keyring = ["keyring>=24.0"]   # evidence.key_provider: keyring
# evidence.key_provider: pkcs11 / tpm need no Python package (ctypes against the vendor module / CNG / tpm2-tools)
copilot = ["llama-cpp-python>=0.3"]                 # offline GGUF inference (CPU; CUDA/Metal/Vulkan builds offload)
copilot-directml = ["onnxruntime-genai-directml>=0.5"]   # Windows GPU/NPU via DirectML
copilot-cuda = ["onnxruntime-genai-cuda>=0.5"]
docs = ["python-pptx>=0.6.21", "pypdf>=3.0.0", "reportlab>=4.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.80.0",
    "httpx>=0.27",            # fastapi.testclient
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "maturin>=1.5,<2.0",      # native/ulpf_core
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
]
benchmark = [
    "rich>=13.0.0",
    "python-docx>=1.0.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.8.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "PySide6>=6.5.0",
    "python-docx>=1.0.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
ulpf = "ulpf.main:main"
ulpf-forensic-verify = "ulpf.forensic_verify:main"

# Only the ulpf package is installed. benchmarks/, tests/, native/ and docs/
# stay in the source tree (`ulpf benchmark` runs from a checkout).
[tool.setuptools.packages.find]
include = ["ulpf*"]
exclude = ["benchmarks*", "tests*", "native*", "docs*", "build*", "scripts*"]

[tool.setuptools.package-data]
ulpf = ["gui/resources/*", "plugin/manifest.json", "engine/schema_registry/*.json", "intelligence/sigma_rules/*.yml",
        "console/static/*", "frontend/*", "frontend/**/*", "runtime/ebpf/*.c", "soar/playbooks/*.yaml"]

# A locally built native core (maturin develop) is never shipped from the
# source tree; wheels for it are built by native/ulpf_core.
[tool.setuptools.exclude-package-data]
ulpf = ["ulpf_core*.pyd", "ulpf_core*.so", "ulpf_core*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["python311", "build", "native/ulpf_core/target", "benchmarks/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^python311/", "^build/", "^native/", "^benchmarks/results/"]

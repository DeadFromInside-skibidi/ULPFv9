---
title: Many blocked destination ports from one source
id: ulpf-0006-blocked-port-sweep
status: stable
description: Connections to more than 20 distinct destination ports denied for one source within a minute.
logsource:
  product: ulpf
detection:
  selection:
    action:
      - denied
      - blocked
      - dropped
  timeframe: 1m
  condition: selection | count(destination.port) by source.ip > 20
level: medium
tags:
  - attack.discovery
  - attack.t1046
